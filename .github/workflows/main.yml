name: Build Mod Menu

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          SDKMAN=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -name sdkmanager -type f | head -n 1)
          echo "sdkmanager: $SDKMAN"
          yes | "$SDKMAN" --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Extract native libs
        run: unzip -o app/build/outputs/apk/debug/app-debug.apk -d out
        continue-on-error: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panel-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload native libs
        uses: actions/upload-artifact@v4
        with:
          name: panel-libs
          path: out/lib/
